<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website cá nhân</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
            line-height: 1.6;
        }

        h1 {
            font-size: 40px;
        }

        .card {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Xin chào 👋</h1>

    <p>Đây là website cá nhân của tôi.</p>

    <div class="card">
        <h2>Giới thiệu</h2>
        <p>
            Tôi có thể viết thông tin giới thiệu của bạn ở đây.
        </p>
    </div>

    <div class="card">
        <h2>Liên hệ</h2>
        <p>Email: example@email.com</p>
    </div>

</body>
</html>
